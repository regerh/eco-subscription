<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        :root { --accent: #ffffff; }
        body { 
            background: radial-gradient(circle at top right, #1a1a1a, #000); 
            color: white; font-family: 'Pretendard', sans-serif; 
            margin: 0; padding: 40px 20px; line-height: 1.6; 
        }
        .header { text-align: center; margin-bottom: 80px; }
        .header h1 { font-size: 3.5rem; letter-spacing: -2px; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
        
        /* 세련된 카드 스타일 */
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 40px; border-radius: 30px; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { border-color: rgba(255, 255, 255, 0.5); transform: translateY(-10px); }
        .badge { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 15px; display: block; }
        .cta-btn { 
            display: inline-block; margin-top: 20px; padding: 12px 25px; 
            background: white; color: black; border-radius: 12px; font-weight: bold; text-decoration: none; 
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Essential Selection</h1>
        <p style="color: #666;">당신의 일상을 재정의하는 스마트한 솔루션</p>
    </div>
    
    <div class="grid">
        <div class="card">
            <span class="badge">Efficiency</span>
            <h2>데스크 셋업 솔루션</h2>
            <p>업무 효율을 200% 올려주는 인체공학적 기기들입니다.</p>
            <a href="#" class="cta-btn">리포트 보기</a>
        </div>
        <div class="card">
            <span class="badge">Well-being</span>
            <h2>수면 케어 시스템</h2>
            <p>질 좋은 수면은 다음 날의 생산성을 결정합니다.</p>
            <a href="#" class="cta-btn">리포트 보기</a>
        </div>
    </div>
</body>
</html>
