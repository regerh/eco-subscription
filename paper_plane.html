<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>골든키워드 연구소</title>
    <style>
        /* 토스 스타일: 깔끔한 폰트와 넓은 여백 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f4f6; 
            margin: 0; padding: 0; display: flex; justify-content: center;
        }
        .wrapper { width: 100%; max-width: 450px; background: white; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 24px; color: #191f28; margin-top: 40px; }
        .card { background: #ffffff; border-radius: 20px; padding: 24px; margin-bottom: 16px; border: 1px solid #e5e8eb; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn { display: block; width: 100%; padding: 18px; background: #3182f6; color: white; text-align: center; border-radius: 16px; text-decoration: none; font-weight: bold; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>좁은 방, 더 넓게 쓰세요</h1>
        <p style="color: #6b7684;">전문가가 엄선한 공간 활용 꿀템 3가지</p>
        
        <div class="card">
            <h3>문걸이 수납 선반</h3>
            <p style="color: #4e5968;">문 뒤 공간을 100% 활용해 보세요.</p>
            <a href="#" class="btn">알아보기</a>
        </div>

        <div class="card">
            <h3>압축봉 다용도 행거</h3>
            <p style="color: #4e5968;">못 없이 간편하게 벽면 수납 완성.</p>
            <a href="#" class="btn">알아보기</a>
        </div>

        <div class="card">
            <h3>침대 밑 수납함</h3>
            <p style="color: #4e5968;">숨어있는 공간을 찾아드립니다.</p>
            <a href="#" class="btn">알아보기</a>
        </div>
    </div>
</body>
</html>
