<!DOCTYPE html>
<html lang="ko">
<head>
    <style>
        body { background: #050505; color: #f5f5f7; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .hero { padding: 80px 20px; text-align: center; }
        h1 { font-size: 3.5rem; background: linear-gradient(to right, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; padding: 40px; max-width: 1000px; margin: auto; }
        .card { background: #111; border: 1px solid #222; padding: 30px; border-radius: 20px; transition: 0.3s; }
        .card:hover { border-color: #444; }
        .price { color: #0071e3; font-weight: bold; margin-top: 10px; display: block; }
        .cta { display: block; background: #0071e3; color: white; padding: 12px; border-radius: 10px; text-align: center; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Tech Radar</h1>
        <p>당신의 삶을 바꿀 차세대 가전을 미리 만나보세요.</p>
    </div>
    <div class="grid">
        <div class="card">
            <h3>AI 로봇 청소기</h3>
            <p>스스로 지도를 그리고 장애물을 피하는 스마트 청소의 정점.</p>
            <span class="price">최저가 확인하기</span>
            <a href="#" class="cta">구매 상세정보</a>
        </div>
        <div class="card">
            <h3>스마트 홈 허브</h3>
            <p>음성 하나로 조명부터 온도까지, 집 전체를 컨트롤하세요.</p>
            <span class="price">최저가 확인하기</span>
            <a href="#" class="cta">구매 상세정보</a>
        </div>
    </div>
</body>
</html>
